<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento:</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="chat">
<header>
<h1>Meu primeiro chat :)</h1>
<p>Conversa local com resposta automática fixa.</p>
</header>
<section id="mensagens" role="log" aria-live="polite"
aria-label="Histórico da conversa">
<p class="bot">Bot: Olá! Envie uma mensagem para testar.</p>
</section>
<form id="formulario">
<label for="texto">Sua mensagem</label>
<div class="entrada">
<input id="texto" type="text" placeholder="Digite aqui..." required>
<button type="submit">Enviar</button>
</div>
</form>
</main>
</body>
</html>
